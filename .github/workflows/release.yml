name: Release

# Publish "Install Penwise" (and the wheel) as a GitHub release: the README's download link
# always points to the latest one. Run it from the Actions tab (Release → Run workflow), or push
# a tag like v0.7.0. The release is named after the version in pyproject.toml.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build Install Penwise and the wheel
        run: |
          python installer/build.py
          python -m pip wheel --no-deps --wheel-dir dist .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          files="dist/Install-Penwise.zip $(ls dist/penwise-*.whl)"
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" $files --clobber
          else
            gh release create "v$version" $files --target "$GITHUB_SHA" --title "Penwise $version" \
              --notes "Download **Install-Penwise.zip**, open it, and click Install. The first time, macOS asks you to allow it: see the README's Quick start."
          fi
