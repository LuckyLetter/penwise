name: Release

# Publish Penwise.dmg (Penwise.app on a disk image, for Apple and Intel Macs) and the wheel (for
# Penwise.app's updates) as a GitHub release: the README's download link always points to the
# latest one. Run it from the Actions tab (Release → Run workflow), or push a tag like
# v0.7.0. The release is named after the version in pyproject.toml, and its page is
# .github/release-notes.md: update it before each release.
#
# The tests run first: nothing is published untested. The disk image is made on Linux. With these
# repository secrets it is made again on a Mac, signed and notarized, and opens without the trip to
# Privacy & Security: MACOS_CERTIFICATE (a "Developer ID Application" certificate exported as .p12,
# in base64), MACOS_CERTIFICATE_PASSWORD, and for notarizing APPLE_ID, APPLE_TEAM_ID and
# APPLE_APP_PASSWORD (an app-specific password from appleid.apple.com).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Each job stops when stuck (an install that hangs), instead of using minutes for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install the browser for the panel tests
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Whether the repository can sign (then the Mac makes the disk image again)
        id: signing
        run: echo "signed=${{ secrets.MACOS_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tools to make a disk image without a Mac (as Firefox's is made)
        run: |
          sudo apt-get update
          sudo apt-get install -y hfsprogs cmake liblzma-dev libbz2-dev zlib1g-dev libssl-dev
          git clone https://github.com/mozilla/libdmg-hfsplus "$RUNNER_TEMP/libdmg"
          git -C "$RUNNER_TEMP/libdmg" checkout e18579b391950589b9ed16ee630c54ce4319bb29
          cmake -S "$RUNNER_TEMP/libdmg" -B "$RUNNER_TEMP/libdmg/build"
          make -C "$RUNNER_TEMP/libdmg/build" dmg-bin hfsplus
          echo "PENWISE_DMG_TOOLS=$RUNNER_TEMP/libdmg/build/dmg:$RUNNER_TEMP/libdmg/build/hfs" >> "$GITHUB_ENV"
      - name: Build Penwise.dmg and the wheel
        run: |
          python installer/build_app.py
          python -m pip wheel --no-deps --wheel-dir dist .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          files="dist/Penwise.dmg $(ls dist/penwise-*.whl)"
          # The release page: .github/release-notes.md, written for this version.
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" $files --clobber
            gh release edit "v$version" --notes-file .github/release-notes.md
          else
            gh release create "v$version" $files --target "$GITHUB_SHA" --title "Penwise $version" \
              --notes-file .github/release-notes.md
          fi

  mac:
    # Signing and notarizing need a Mac: its Penwise.dmg replaces the one made on Linux. Without a
    # certificate it would be the same app, unsigned: the Linux one stays.
    needs: release
    if: needs.release.outputs.signed == 'true'
    runs-on: macos-latest
    timeout-minutes: 45 # notarizing waits for Apple
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The signing certificate
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          echo "PENWISE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials penwise --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "PENWISE_NOTARY_PROFILE=penwise" >> "$GITHUB_ENV"
          fi
      - name: Build Penwise.app and its disk image
        run: python installer/build_app.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          gh release upload "v$version" dist/Penwise.dmg --clobber
