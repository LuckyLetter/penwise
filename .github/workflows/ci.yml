name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install browser for the panel tests
        run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  macos-integration:
    name: Real Mac (Keychain and Hammerspoon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Use a temporary, unlocked keychain
        run: |
          security create-keychain -p ci penwise-ci.keychain
          security list-keychains -d user -s penwise-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s penwise-ci.keychain
          security unlock-keychain -p ci penwise-ci.keychain
          security set-keychain-settings penwise-ci.keychain
      - name: Install Hammerspoon
        run: |
          brew install --cask hammerspoon
          xattr -dr com.apple.quarantine /Applications/Hammerspoon.app || true
      - name: Test
        env:
          PENWISE_MACOS_INTEGRATION: "1"
        run: pytest -v tests/test_macos.py

  installer:
    name: Install Penwise on a real Mac, then uninstall it
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build Install Penwise and unzip it, as the Mac does
        run: |
          python installer/build.py
          ditto -x -k dist/Install-Penwise.zip "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/Install Penwise.app/Contents/MacOS/Install Penwise"
      - name: Install from it (its script, without the dialogs, which would wait for a click)
        run: |
          app="$RUNNER_TEMP/Install Penwise.app"
          cp "$app/Contents/MacOS/Install Penwise" "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh" "$(ls "$app"/Contents/Resources/penwise-*.whl)"
      - name: Check what it installed
        run: |
          ~/.local/bin/penwise --version
          app=$(ls -d /Applications/Hammerspoon.app ~/Applications/Hammerspoon.app 2>/dev/null | head -1)
          codesign --verify "$app"
          grep -q "spoon.Penwise.background = true" ~/.hammerspoon/init.lua
          test -d ~/.hammerspoon/Spoons/Penwise.spoon
          pgrep -x Hammerspoon
      - name: Uninstall, Hammerspoon included
        run: |
          ~/.local/bin/penwise uninstall --yes --hammerspoon
          sleep 3
          test ! -e ~/.local/bin/penwise
          test ! -e ~/.hammerspoon/Spoons/Penwise.spoon
          test ! -e /Applications/Hammerspoon.app && test ! -e ~/Applications/Hammerspoon.app
          if pgrep -x Hammerspoon; then echo "Hammerspoon still runs"; exit 1; fi
