name: CI

# Run by hand (Actions → CI → Run workflow), say for the tests on a real Mac: GitHub's minutes go to
# releases, which run the tests themselves before publishing.
on:
  workflow_dispatch:

# Tests only read the code: the token they get can't change the repository.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install browser for the panel tests
        run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  macos-integration:
    name: Real Mac (Keychain and Hammerspoon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Use a temporary, unlocked keychain
        run: |
          security create-keychain -p ci penwise-ci.keychain
          security list-keychains -d user -s penwise-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s penwise-ci.keychain
          security unlock-keychain -p ci penwise-ci.keychain
          security set-keychain-settings penwise-ci.keychain
      - name: Install Hammerspoon
        run: |
          brew install --cask hammerspoon
          xattr -dr com.apple.quarantine /Applications/Hammerspoon.app || true
      - name: Test
        env:
          PENWISE_MACOS_INTEGRATION: "1"
        run: pytest -v tests/test_macos.py
