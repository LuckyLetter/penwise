<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Penwise</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #e3e3e8;
    --accent: #2f6fde;
    --accent-text: #ffffff;
    --del: #c4302b;
    --del-bg: #fdecea;
    --ins: #1f7a3d;
    --ins-bg: #e6f4ea;
    --warn-bg: #fff6e0;
    --warn-text: #7a5300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e20;
      --surface: #2a2a2d;
      --text: #f2f2f4;
      --muted: #a1a1a6;
      --border: #3a3a3e;
      --accent: #4c8dff;
      --del: #ff7b72;
      --del-bg: #3d1f1f;
      --ins: #6fdc8c;
      --ins-bg: #1c3624;
      --warn-bg: #3a2f14;
      --warn-text: #f5d68a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  header, footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-color: var(--border);
  }
  header { border-bottom: 1px solid var(--border); }
  footer { border-top: 1px solid var(--border); }
  .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 12px; }
  #model { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 560px) { #hint { display: none; } }

  .modes { display: inline-flex; background: var(--surface); border-radius: 7px; padding: 2px; }
  .modes button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    padding: 3px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  .modes button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.15); }

  main { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .text {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.65;
    -webkit-user-select: text;
    user-select: text;
  }
  .loading .text { color: var(--muted); }
  .status { margin-top: 12px; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .change { cursor: pointer; border-radius: 3px; }
  .change del { color: var(--del); background: var(--del-bg); text-decoration-thickness: 1px; }
  .change ins { color: var(--ins); background: var(--ins-bg); text-decoration: none; }
  .change del + ins { margin-left: 2px; }
  .change.undone { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
  .change.active { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tips { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--surface); font-size: 13px; color: var(--muted); }
  .banner { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-text); }
  .good { margin-top: 12px; color: var(--ins); font-weight: 500; }
  .insight { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .insight .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .insight .bar { grid-column: 1 / 3; height: 4px; border-radius: 2px; background: var(--accent); opacity: 0.55; }
  .insight .note, .insight .example { grid-column: 1 / 3; font-size: 13px; color: var(--muted); }
  .note-text { margin: 0; white-space: pre-wrap; font: 13px/1.55 ui-monospace, "SF Mono", Menlo, monospace; -webkit-user-select: text; user-select: text; }
  .error { color: var(--del); }

  h2 { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 2px 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  li:hover, li.active { background: var(--surface); }
  li.undone .what, li.undone .note { opacity: 0.45; }
  li .num { color: var(--muted); font-size: 12px; padding-top: 2px; }
  li .what { font-weight: 500; }
  li .what del { color: var(--del); text-decoration-thickness: 1px; }
  li .what ins { color: var(--ins); text-decoration: none; }
  li .tag { font-size: 12px; color: var(--accent); white-space: nowrap; }
  li .note, li .why, li .seen { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
  li .why { color: var(--text); }
  li .risk { grid-column: 2 / 4; font-size: 13px; color: var(--warn-text); }
  li .keep { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
  button.link { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
  li .seen { font-size: 12px; }

  button.primary, button.secondary {
    font: inherit;
    font-size: 13px;
    border-radius: 7px;
    padding: 5px 14px;
    cursor: pointer;
  }
  button.primary { border: 0; background: var(--accent); color: var(--accent-text); }
  button.secondary { border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  button:disabled { opacity: 0.4; cursor: default; }
  [hidden] { display: none !important; }
  kbd { font: inherit; font-size: 11px; opacity: 0.75; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <div class="modes" id="modes" role="group" aria-label="Mode">
    <button type="button" data-mode="fix" title="Only fix errors (Tab to switch)">Fix</button>
    <button type="button" data-mode="improve" title="Also improve clarity and flow (Tab to switch)">Improve</button>
  </div>
  <div class="modes" id="tones" role="group" aria-label="Tone" hidden>
    <button type="button" data-style="academic" title="Improve for research writing">Research</button>
    <button type="button" data-style="email" title="Improve for an email">Email</button>
    <button type="button" data-style="chat" title="Improve for a chat message">Chat</button>
  </div>
  <span class="spacer"></span>
  <span class="muted" id="model"></span>
</header>

<main id="main"></main>

<footer>
  <span class="muted" id="hint">Click a change to undo it.</span>
  <span class="spacer"></span>
  <button type="button" class="secondary" id="cancel">Cancel<kbd>esc</kbd></button>
  <button type="button" class="secondary" id="copy">Copy<kbd>⌘C</kbd></button>
  <button type="button" class="primary" id="replace">Replace<kbd>↩</kbd></button>
</footer>

<script>
"use strict";

// Messages to Hammerspoon. Outside Hammerspoon (e.g. in a browser) they are logged.
function post(message) {
  if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.penwise) {
    webkit.messageHandlers.penwise.postMessage(message);
  } else {
    console.log("penwise →", JSON.stringify(message));
  }
}

const state = {
  status: "idle", // idle | loading | ready | error | note | insights
  original: "",
  mode: "fix",
  model: "",
  segments: [],
  changes: [],
  undone: new Set(),
  kept: new Set(), // words you asked Penwise to always keep
  warnings: [],
  error: "",
  note: { title: "", text: "" },
  insights: null,
  explain: false,
  style: "academic",
  tips: false,
  explaining: false,
  startedAt: 0,
  elapsedMs: 0,
};

// While checking, a ticking timer shows that something is happening. When the
// text needs no changes, the panel closes by itself unless you interact with it.
const AUTO_CLOSE_MS = 1500;
let ticker = null;
let autoClose = null;

function stopTimers() {
  clearInterval(ticker);
  clearTimeout(autoClose);
  ticker = autoClose = null;
}

function progressText() {
  const seconds = Math.floor((Date.now() - state.startedAt) / 1000);
  return (state.mode === "fix" ? "Checking…" : "Improving…") + (seconds >= 1 ? ` ${seconds}s` : "");
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) {
    if (child !== null && child !== undefined && child !== false) node.append(child);
  }
  return node;
}

function finalText() {
  const byId = new Map(state.changes.map((c) => [c.id, c]));
  return state.segments
    .map((seg) => ("text" in seg ? seg.text : (state.undone.has(seg.change) ? byId.get(seg.change).before : byId.get(seg.change).after)))
    .join("");
}

function acceptedChanges() {
  return state.changes.filter((c) => !state.undone.has(c.id));
}

function toggle(id) {
  if (state.undone.has(id)) state.undone.delete(id);
  else state.undone.add(id);
  render();
}

// Offer "never change this" where the model may be "fixing" a name or a term: spelling
// changes, or words with capitals or digits (Pytorch, ResNet50), of at most 3 words.
const KEEPABLE = new Set(["spelling", "capitalization", "word-choice"]);

function keepable(change) {
  const word = change.before.trim();
  return change.after.trim() && !change.risk && KEEPABLE.has(change.category) &&
    (change.category === "spelling" || /[\p{Lu}\p{N}]/u.test(word)) &&
    /^[\p{L}\p{N}][\p{L}\p{N}'’.\-]*(?: [\p{L}\p{N}'’.\-]+){0,2}$/u.test(word);
}

function keepWord(word) {
  state.kept.add(word);
  for (const change of state.changes) {
    if (change.before.trim() === word) state.undone.add(change.id);
  }
  post({ action: "keep", word });
  render();
}

function highlight(id, on) {
  document.querySelectorAll(`[data-change="${id}"]`).forEach((node) => node.classList.toggle("active", on));
}

function changeWords(change) {
  const before = change.before.trim();
  const after = change.after.trim();
  if (before && after && /[\p{L}\p{N}]/u.test(before + after)) {
    return [el("del", {}, before), " → ", el("ins", {}, after)];
  }
  // Small edits (a comma, an added or dropped word) are easier to read after the word before them.
  const lead = (change.context_before.match(/\S+\s*$/) || [""])[0];
  return [lead, change.before && el("del", {}, change.before), change.after && el("ins", {}, change.after)];
}

function renderText() {
  const byId = new Map(state.changes.map((c) => [c.id, c]));
  const text = el("div", { class: "text" });
  for (const seg of state.segments) {
    if ("text" in seg) {
      text.append(seg.text);
      continue;
    }
    const change = byId.get(seg.change);
    const undone = state.undone.has(change.id);
    text.append(
      el(
        "span",
        {
          class: "change" + (undone ? " undone" : ""),
          "data-change": change.id,
          title: undone ? "Click to apply this change" : "Click to undo this change",
          onclick: () => toggle(change.id),
          onmouseenter: () => highlight(change.id, true),
          onmouseleave: () => highlight(change.id, false),
        },
        ...(undone ? [change.before] : [change.before && el("del", {}, change.before), change.after && el("ins", {}, change.after)]),
      ),
    );
  }
  return text;
}

function renderChanges() {
  const list = el("ol");
  state.changes.forEach((change, index) => {
    const seen = change.seen ? `You've made this fix ${change.seen}× before.` : "";
    list.append(
      el(
        "li",
        {
          class: state.undone.has(change.id) ? "undone" : "",
          "data-change": change.id,
          onclick: () => toggle(change.id),
          onmouseenter: () => highlight(change.id, true),
          onmouseleave: () => highlight(change.id, false),
        },
        el("span", { class: "num" }, index < 9 ? String(index + 1) : ""),
        el("span", { class: "what" }, ...changeWords(change)),
        el("span", { class: "tag" }, change.label),
        el("span", { class: "note" }, change.note),
        change.reason && el("span", { class: "why" }, "Why: " + change.reason),
        change.risk && state.undone.has(change.id) &&
          el("span", { class: "risk" }, `Not applied: it would change ${change.risk}. Click to apply it.`),
        state.kept.has(change.before.trim())
          ? el("span", { class: "keep" }, `Kept: Penwise won't change “${change.before.trim()}” again.`)
          : keepable(change) &&
            el("span", { class: "keep" },
              el("button", {
                type: "button", class: "link",
                onclick: (event) => { event.stopPropagation(); keepWord(change.before.trim()); },
              }, `Always keep “${change.before.trim()}”`),
            ),
        seen && el("span", { class: "seen" }, seen),
      ),
    );
  });
  return list;
}

// "Your recurring fixes": what you fix most, the rule for each, and fixes you keep repeating.
function renderInsights(data) {
  const parts = [el("h2", {}, "Your recurring fixes")];
  if (!data.total) {
    parts.push(el("div", { class: "muted" }, "No history yet. Accept some changes, and your patterns will show up here."));
    return parts;
  }
  parts.push(el("div", { class: "muted" }, `${data.total} changes you accepted since ${data.since}`));
  const most = Math.max(...data.categories.map((c) => c.count));
  for (const category of data.categories) {
    parts.push(
      el("div", { class: "insight" },
        el("strong", {}, category.label),
        el("span", { class: "count" }, `${category.count}×`),
        el("div", { class: "bar", style: `width: ${Math.max(4, (100 * category.count) / most)}%` }),
        category.note && el("span", { class: "note" }, category.note),
      ),
    );
  }
  if (data.repeated.length) {
    parts.push(el("h2", {}, "Fixes you've made more than once"));
    for (const item of data.repeated) {
      parts.push(
        el("div", { class: "insight" },
          el("strong", {}, item.pair),
          el("span", { class: "count" }, `${item.count}×`),
          item.example && el("span", { class: "example" }, `e.g. …${item.example}…`),
        ),
      );
    }
  }
  return parts;
}

function render() {
  document.querySelectorAll("[data-mode]").forEach((button) => {
    button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode));
  });
  document.querySelectorAll("[data-style]").forEach((button) => {
    button.setAttribute("aria-pressed", String(button.dataset.style === state.style));
  });
  const took = state.status === "ready" && state.elapsedMs ? ` · ${(state.elapsedMs / 1000).toFixed(1)}s` : "";
  // "mistralai/mistral-small-2603" → "mistral-small-2603"
  document.getElementById("model").textContent = state.model.split("/").pop() + took;
  document.getElementById("model").title = state.model;

  const main = document.getElementById("main");
  main.className = state.status;
  main.replaceChildren();

  if (state.status === "loading") {
    main.append(el("div", { class: "text" }, state.original));
    main.append(el("div", { class: "status muted pulse", id: "progress" }, progressText()));
  } else if (state.status === "insights") {
    main.append(...renderInsights(state.insights));
  } else if (state.status === "note") {
    main.append(el("h2", {}, state.note.title), el("pre", { class: "note-text" }, state.note.text));
  } else if (state.status === "error") {
    main.append(el("div", { class: "error" }, state.error));
    main.append(
      el("div", { class: "status" },
        el("button", { type: "button", class: "primary", onclick: retry }, "Try again", el("kbd", {}, "↩")),
        " ",
        el("button", { type: "button", class: "secondary", onclick: () => post({ action: "doctor" }) }, "Check my setup"),
        el("span", { class: "muted" }, "  opens a diagnosis in Terminal"),
      ),
    );
  } else if (state.status === "ready") {
    if (state.tips && state.changes.length) {
      main.append(el("div", { class: "tips" },
        "New here? Click a change to undo it, press Return to replace your text. ",
        "Not sure how to say something? Write it in your own language or [[like this]], or leave [[?]] for a word."));
    }
    for (const warning of state.warnings) main.append(el("div", { class: "banner" }, warning));
    main.append(renderText());
    if (state.changes.length) {
      const title = `${state.changes.length} change${state.changes.length === 1 ? "" : "s"}` + (state.explaining ? " · explaining…" : "");
      main.append(el("h2", {}, title), renderChanges());
    } else if (!state.warnings.length) {
      main.append(el("div", { class: "good" }, "Looks good. No changes needed."));
    }
  }

  const ready = state.status === "ready";
  document.getElementById("replace").disabled = !ready;
  document.getElementById("copy").disabled = !ready;
  // Views without text to edit only need a Close button.
  const reading = state.status === "insights" || state.status === "note";
  for (const id of ["replace", "copy"]) document.getElementById(id).hidden = reading;
  document.getElementById("modes").hidden = reading;
  // Improve's tone: guessed from the app, one click to change.
  document.getElementById("tones").hidden = reading || state.mode !== "improve";
  document.getElementById("cancel").firstChild.textContent = reading ? "Close" : "Cancel";
  document.getElementById("hint").textContent = ready && state.changes.length ? "Click a change, or press its number, to undo it." : "";
  if (state.status !== "idle") reportSize();
}

// Tell Hammerspoon how tall the content is, so the window fits it: a short text gets a
// small panel. `viewport` lets it work out how much the window adds (the title bar).
let reportedHeight = 0;

function reportSize() {
  const main = document.getElementById("main");
  main.style.flex = "none"; // as tall as its content, for a moment
  const height = document.querySelector("header").offsetHeight + main.offsetHeight +
    document.querySelector("footer").offsetHeight;
  main.style.flex = "";
  if (Math.abs(height - reportedHeight) > 2) {
    reportedHeight = height;
    post({ action: "size", height, viewport: window.innerHeight });
  }
}

function setMode(mode) {
  if (mode !== state.mode && state.original && state.status !== "note") post({ action: "mode", mode });
}

function setStyle(style) {
  if (style !== state.style && state.original && state.mode === "improve") post({ action: "style", style });
}

function replace() {
  if (state.status !== "ready") return;
  const accepted = acceptedChanges().map(({ before, after, category, context_before, context_after }) => ({
    before, after, category, context_before, context_after,
  }));
  post({ action: "replace", text: finalText(), changes: accepted });
}

function retry() {
  if (state.status === "error" && state.original) post({ action: "retry", mode: state.mode });
}

function copy() {
  if (state.status === "ready") post({ action: "copy", text: finalText() });
}

// Events from Hammerspoon (begin) and from `penwise check --format jsonl` (the rest).
window.penwise = {
  receive(event) {
    switch (event.type) {
      case "begin":
        stopTimers();
        Object.assign(state, {
          status: "loading", original: event.original, mode: event.mode, startedAt: Date.now(), elapsedMs: 0,
          segments: [], changes: [], undone: new Set(), warnings: [], error: "", explaining: false,
        });
        ticker = setInterval(() => {
          const progress = document.getElementById("progress");
          if (progress) progress.textContent = progressText();
        }, 250);
        break;
      case "start":
        state.model = event.model;
        state.style = event.style || "academic";
        state.tips = Boolean(event.tips);
        state.explain = Boolean(event.explain);
        break;
      case "result":
        stopTimers();
        Object.assign(state, {
          status: "ready", segments: event.segments, changes: event.changes, warnings: event.warnings,
          explaining: state.explain && event.changes.length > 0, elapsedMs: event.elapsed_ms,
          // Changes to numbers, citations, acronyms, math, code or links start out not applied.
          undone: new Set(event.changes.filter((c) => c.risk).map((c) => c.id)),
        });
        if (!event.changes.length && !event.warnings.length) {
          autoClose = setTimeout(() => post({ action: "cancel" }), AUTO_CLOSE_MS);
        }
        break;
      case "explanations":
        for (const change of state.changes) {
          if (event.reasons[change.id]) change.reason = event.reasons[change.id];
        }
        break;
      case "done":
        state.explaining = false;
        break;
      case "insights":
        stopTimers();
        Object.assign(state, { status: "insights", original: "", insights: event });
        break;
      case "note":
        stopTimers();
        Object.assign(state, { status: "note", original: "", note: { title: event.title, text: event.text } });
        break;
      case "error":
        stopTimers();
        Object.assign(state, { status: "error", error: event.message });
        break;
    }
    render();
  },
};

document.querySelectorAll("[data-mode]").forEach((button) => {
  button.addEventListener("click", () => setMode(button.dataset.mode));
});
document.querySelectorAll("[data-style]").forEach((button) => {
  button.addEventListener("click", () => setStyle(button.dataset.style));
});
document.getElementById("cancel").addEventListener("click", () => post({ action: "cancel" }));
document.getElementById("copy").addEventListener("click", copy);
document.getElementById("replace").addEventListener("click", replace);

// A new width can change how the text wraps.
window.addEventListener("resize", () => {
  if (state.status !== "idle") reportSize();
});

// Any interaction keeps a "looks good" panel open.
document.addEventListener("mousedown", () => clearTimeout(autoClose));

document.addEventListener("keydown", (event) => {
  clearTimeout(autoClose);
  const selection = String(window.getSelection());
  if (event.key === "Enter") {
    event.preventDefault();
    if (state.status === "error") retry();
    else replace();
  } else if (event.key === "Escape") {
    event.preventDefault();
    post({ action: "cancel" });
  } else if (event.key === "Tab") {
    event.preventDefault();
    setMode(state.mode === "fix" ? "improve" : "fix");
  } else if (event.metaKey && event.key === "c" && !selection) {
    event.preventDefault();
    copy();
  } else if (/^[1-9]$/.test(event.key) && !event.metaKey && state.status === "ready") {
    const change = state.changes[Number(event.key) - 1];
    if (change) toggle(change.id);
  }
});

render();
post({ action: "ready" });
</script>
</body>
</html>
